services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: biznoryx
      POSTGRES_USER: biznoryx_admin
      POSTGRES_PASSWORD: biznoryx_local_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biznoryx_admin -d biznoryx"]
      interval: 5s
      timeout: 5s
      retries: 20
