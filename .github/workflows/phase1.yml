name: Phase 1 Acceptance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repair-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: biznoryx_local_repair_test
          POSTGRES_USER: biznoryx_local_admin
          POSTGRES_PASSWORD: synthetic_ci_repair_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biznoryx_local_admin -d biznoryx_local_repair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify guarded tooling and synthetic database repair
        run: node --test tests/database-rehearsal.test.mjs tests/postgres-database-repair.test.mjs
        env:
          LOCAL_DB_REPAIR_TEST_URL: postgresql://biznoryx_local_admin:synthetic_ci_repair_only@127.0.0.1:5432/biznoryx_local_repair_test
      - name: Verify runtime against repaired synthetic schema
        run: node --test tests/postgres-runtime.test.mjs tests/postgres-native-auth.test.mjs tests/postgres-data-ingestion.test.mjs tests/billing-webhook-security.test.mjs tests/policy-security.test.mjs tests/postgres-evidence-report.test.mjs tests/postgres-business-actions.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://biznoryx_local_admin:synthetic_ci_repair_only@127.0.0.1:5432/biznoryx_local_repair_test?options=-c%20role%3Dbiznoryx_repair_fixture
      - name: Verify manual entry, trial and Updates after repair
        run: node --test tests/postgres-manual-entry.test.mjs tests/billing-trial-postgres.test.mjs tests/postgres-updates.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://biznoryx_local_admin:synthetic_ci_repair_only@127.0.0.1:5432/biznoryx_local_repair_test
          UPDATES_TEST_ADMIN_DATABASE_URL: postgresql://biznoryx_local_admin:synthetic_ci_repair_only@127.0.0.1:5432/biznoryx_local_repair_test
          TRIAL_TEST_ADMIN_DATABASE_URL: postgresql://biznoryx_local_admin:synthetic_ci_repair_only@127.0.0.1:5432/postgres

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: biznoryx
          POSTGRES_USER: biznoryx_admin
          POSTGRES_PASSWORD: biznoryx_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biznoryx_admin -d biznoryx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify local gates
        run: npm run verify

      - name: Audit production dependency advisories
        run: npm audit --omit=dev

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Render isolated synthetic owner-record fixtures
        run: node scripts/generate-extraction-fixtures.mjs --suite owner-records --png

      - name: Verify desktop and mobile browser journeys
        run: npm run test:browser 2>&1 | tee browser-test.log; exit ${PIPESTATUS[0]}

      - name: Summarize browser failures
        if: failure()
        run: |
          {
            echo '### Browser journey failures'
            echo '```'
            grep -E '✘|Error:|Expected|Received|Timeout|failed|passed' browser-test.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            browser-test.log
            test-results/
          if-no-files-found: ignore

      - name: Verify PostgreSQL RLS acceptance
        run: npm run db:acceptance
        env:
          DATABASE_URL: postgresql://biznoryx_admin:biznoryx_ci_password@localhost:5432/biznoryx
          BIZNORYX_APP_DB_PASSWORD: biznoryx_runtime_ci_password

      - name: Verify durable runtime behavior
        run: node --test tests/postgres-runtime.test.mjs tests/postgres-native-auth.test.mjs tests/postgres-data-ingestion.test.mjs tests/billing-webhook-security.test.mjs tests/policy-security.test.mjs tests/postgres-evidence-report.test.mjs tests/postgres-business-actions.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://biznoryx_app:biznoryx_runtime_ci_password@localhost:5432/biznoryx

      - name: Verify manual entry and trial database boundaries
        run: node --test tests/postgres-manual-entry.test.mjs tests/billing-trial-postgres.test.mjs tests/postgres-updates.test.mjs
        env:
          TEST_DATABASE_URL: postgresql://biznoryx_admin:biznoryx_ci_password@localhost:5432/biznoryx
          UPDATES_TEST_ADMIN_DATABASE_URL: postgresql://biznoryx_admin:biznoryx_ci_password@localhost:5432/biznoryx
          TRIAL_TEST_ADMIN_DATABASE_URL: postgresql://biznoryx_admin:biznoryx_ci_password@127.0.0.1:5432/postgres
